# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02) — số đối chiếu từ `python lab13.py`
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm.
#   b) Theo nhân viên, m = 75: DE = 1 + (75-1)*0,02 = 2,48; cần 3.103 yêu cầu/nhóm → 42 người/nhóm (tổng 84 > 40: không đủ).
#   c) 20 nhân viên/nhóm: cỡ mẫu hiệu dụng tối đa = 20/0,02 = 1.000 < 1.251 (không đạt MDE 5 điểm).
#   d) 6 depot/nhóm: tối đa 6/0,02 = 300 (không đạt, và dưới 20 cụm/nhóm).
#   e) Mức chênh 6 điểm (859 mỗi nhóm hiệu dụng), 20 nhân viên/nhóm: m ≥ 299 yêu cầu/người (DE = 6,96); power nếu tác động thật chỉ 5 điểm ở n = 859 chỉ khoảng 0,64.
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có — hai nhóm chạy đồng thời trong cùng pilot, mỗi yêu cầu được gán ngẫu nhiên một trong hai nhóm.
#   2. Chia ngẫu nhiên hay do người chọn: Ngẫu nhiên theo từng yêu cầu (seed cố định, ghi trong hồ sơ).
#   3. Ảnh hưởng gián tiếp và cách giảm: Cùng một nhân viên có thể xử lý cả hai nhóm; giảm nhiễu bằng phân tầng ngẫu nhiên theo depot và phân tích kết quả theo depot, chỉ số chính đo ở mức yêu cầu nên không phụ thuộc vào việc ai xử lý.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có — chỉ số chính, MDE 5 điểm, alpha 0,05, power 0,8 và ngày quyết định ghi trong file này trước khi chạy.
#   5. Ít nhất 20 cụm mỗi nhóm: Không áp dụng — không chia theo cụm; rủi ro nhiễu ở mức nhân viên được giảm bằng phân tầng depot và đo riêng chỉ số dùng/an toàn theo depot.
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Chia theo yêu cầu không có cụm nên không đạt ngưỡng "20 cụm/nhóm" (điều kiện chỉ áp dụng khi chia theo cụm),
#   đổi lại đủ cỡ mẫu ở đúng MDE +5 điểm (1.251/nhóm ≈ 2 ngày chạy trong phạm vi pilot ~1.200 yêu cầu/ngày)
#   và không đụng trần 40 nhân viên / 12 depot. Chấp nhận rủi ro nhiễm chéo nhẹ ở mức nhân viên.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Toàn bộ mẫu chạy thử: 4,25% (51/1.200); trong phạm vi noi_dia + hang_nang: 3,97% (39/982).
#   Ngưỡng dừng an toàn đặt ở 6,0% trong phạm vi pilot — cao hơn baseline 3,97% khoảng 1,5 lần,
#   nên pilot không bị dừng ngay tuần đầu; mọi vượt ngưỡng đều kích hoạt rà soát trước khi dừng.

pilot:
  owner: "Trưởng ca CSKH (điều phối pilot)"   # một người có tên vai trò, không ghi "cả đội"
  scope: "noi_dia + hang_nang; toàn bộ 12 depot; loại quoc_te (22.515 đ/việc = 1,88×) và doi_tac (10.215 đ/việc = 0,85×, điều khoản riêng) khỏi phạm vi theo A3"
  assignment:
    unit: "request"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần; chỉ nhóm can thiệp nhận gợi ý theo tỉ lệ rollout
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.05
    alpha: 0.05
    power: 0.80
    n_per_arm: 1251
    design_effect: 1              # chia theo yêu cầu, không có cụm
    clusters_per_arm: ""          # không chia theo cụm
  identifiability:
    concurrent_control: "Có — nhóm đối chứng chạy cùng thời gian, cùng depot, cùng danh mục yêu cầu"
    spillover_risk: "Trung bình — cùng nhân viên xử lý cả hai nhóm; giảm bằng phân tầng theo depot, phân tích theo depot và đo chỉ số dùng/an toàn tách theo depot"
    predeclared: "Có — chỉ số chính, MDE, alpha, power, luật dừng và ngày quyết định ghi trước trong file này"
  stop_rules:
    - "NẾU tỉ lệ mo_lai_trong_7_ngay trong nhóm can thiệp > 6,0% TRONG 7 ngày liên tiếp THÌ dừng tăng rollout và rà soát top lỗi KHÔNG THÌ tiếp tục rollout bước kế"
    - "NẾU chi phí mỗi việc thành công đo thật (token + tool + phút xem/làm lại đo thật) > 12.000 đ TRONG 2 tuần liên tiếp THÌ dừng pilot và quay lại cổng KHÔNG THÌ cho phép hoàn tất pilot"
    - "NẾU tỉ lệ yêu cầu có gợi ý được xem lại (duoc_xem_lai == 1) > 80% HOẶC tỉ lệ bỏ qua (sua + bo) > 50% TRONG tuần đầu THÌ dừng tăng rollout, rà soát quy trình xem lại KHÔNG THÌ giữ rollout và ghi nhận vào báo cáo tuần"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Trưởng ca CSKH bấm tắt cờ tính năng trong < 15 phút; nhân viên quay về xử lý thủ công như trước pilot, không mất yêu cầu nào vì mọi yêu cầu đều có trace_id"
  decision_date: "Sau khi mỗi nhóm đủ 1.251 yêu cầu (khoảng 1–2 ngày chạy trong phạm vi pilot); hội đồng Gate 2b quyết định Go/No-go trong tuần sau khi kết thúc rollout"
  simulated_inputs: ["phut_xem_lai_simulated", "phut_lam_lai_simulated"]
